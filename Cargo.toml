[package]
name = "sleeper"
version = "0.1.0"
edition = "2021"
description = "Sleeper fantasy sports CLI and MCP server"

[[bin]]
name = "sleeper"
path = "src/main.rs"

[[bin]]
name = "sleeper-mcp"
path = "src/bin/sleeper_mcp.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hex = "0.4"
rmcp = { version = "0.1", features = ["server", "transport-io"] }
schemars = "0.8"
chrono = { version = "0.4", features = ["serde"] }
scraper = "0.20"
futures = "0.3.34"
chromiumoxide = "0.9.1"
zip = "2"
libc = "0.2"
fs2 = "0.4"
